# Rsync Backup - Global Configuration
# =====================================
# Machine-specific overrides (DST, LOG_FILE, etc.) go in .env — see .env.example

# Rsync base flags
RSYNC_FLAGS="--archive --verbose --human-readable --progress --partial"

# Delete files on destination that no longer exist on source (yes/no)
# When "yes", rsync uses --delete to create an exact mirror of the source
RSYNC_DELETE=yes

# Versioning safety net (yes/no): files deleted or overwritten on the
# destination are moved to $DST/<hostname>/.versions/<run timestamp>/
# instead of being lost. Override per-run with --no-versions.
VERSIONING=yes

# Prune version dirs older than N days after each run (0 = keep forever)
VERSIONS_KEEP_DAYS=30

# ...but always keep the N most recent version dirs, whatever their age:
# with a backup run once a month, an age limit alone can leave only the last run
VERSIONS_KEEP_RUNS=3

# Rotate LOG_FILE to LOG_FILE.1 when it grows beyond this size in MB (0 = never)
LOG_MAX_MB=20

# Write rsync's per-file list to LOG_FILE too (yes/no). With "no" each job
# gets a header, its errors in full, the counts and a closing line with the
# duration and the exit code
LOG_FILE_LIST=no
