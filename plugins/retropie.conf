# RetroPie - dal 2026-10-18 vive nel container retropie-docker: ROM, BIOS, salvataggi e configurazioni
# stanno tutti nella sua cartella dati. Il RetroPie nativo (~/RetroPie, ~/RetroPie-Setup, /opt/retropie)
# è stato disinstallato; il suo archivio è in ~/backups/retropie/ (plugin backups.local).
ENABLED=yes

PATH $HOME/Workspaces/docker/retropie-docker/data
EXCLUDE downloaded_images/
EXCLUDE retroarch-logs/
