# Virt-Manager - Virtual machine configurations and storage pools
ENABLED=yes

# Immagini di VM: cambiano a ogni avvio (e a ogni ritorno a uno snapshot) e verrebbero
# versionate intere a ogni giro. Lo storico sta negli snapshot interni dei .qcow2.
VERSIONING no

PATH $HOME/.config/libvirt
PATH /etc/libvirt
EXCLUDE qemu/save/
PATH /var/lib/libvirt/images
PATH /var/lib/libvirt/qemu/nvram
PATH $HOME/Workspaces/qemu/storage/hd
PATH $HOME/Workspaces/qemu/storage/Iso
# distribuzioni Linux: si riscaricano. Windows/ (Win9x-XP-7), Utility/ e addons/ restano: non si ritrovano
EXCLUDE /Distro/
PATH $HOME/Workspaces/qemu/storage/floppy
PATH $HOME/Workspaces/qemu/storage/shared

RESTORE_CMD bash -c 'for f in /etc/libvirt/qemu/*.xml; do [ -f "$f" ] && sudo virsh define "$f" 2>/dev/null; done; true'
