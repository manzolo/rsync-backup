# Workspaces - Development projects
ENABLED=yes

PATH $HOME/Workspaces
EXCLUDE node_modules/
EXCLUDE vendor/
EXCLUDE .gradle/
EXCLUDE build/
EXCLUDE __pycache__/
EXCLUDE .venv/
EXCLUDE *.pyc
# qemu/storage/{hd,Iso,floppy,shared} sono del plugin virt-manager (senza versioning):
# qui li si esclude, o passerebbero anche da questo job e verrebbero versionati lo stesso
EXCLUDE /qemu/storage/hd/
EXCLUDE /qemu/storage/Iso/
EXCLUDE /qemu/storage/floppy/
EXCLUDE /qemu/storage/shared/
# prodotti delle build di qemu-iso-lab (dischi di prova, log, report): rigenerabili
EXCLUDE /qemu/qemu-iso-lab/artifacts/
